name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat <<'EOF' > .env
          DB_HOST=db
          DB_PORT=5432
          DB_USERNAME=care_senior
          DB_PASSWORD=care_senior_ci
          DB_NAME=care_senior
          API_PORT=3000
          JWT_SECRET=ci-access-secret-with-at-least-32-characters
          JWT_REFRESH_SECRET=ci-refresh-secret-with-at-least-32-characters
          CORS_ORIGIN=http://localhost:5173
          COOKIE_SECURE=false
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_FROM=Care Senior <ci@caresenior.dev>
          PASSWORD_RESET_URL=http://localhost:5173/redefinir-senha
          STAFF_INVITE_URL=http://localhost:5173/criar-senha
          GUARDIAN_INVITE_URL=http://localhost:5173/responsavel/criar-senha
          CPF_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          EOF

      - name: Build images
        run: docker compose build

      - name: Lint
        run: docker compose run --rm api-dev npm run lint

      - name: Unit tests
        run: docker compose run --rm api-dev npm test

      - name: Migrate database
        run: docker compose run --rm api-dev npm run db:migrate

      - name: E2E tests
        run: docker compose run --rm api-dev npm run test:e2e

      - name: Tear down
        if: always()
        run: docker compose down -v
